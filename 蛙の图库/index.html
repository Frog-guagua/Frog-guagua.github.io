<script>
const cw = document.getElementById('cursor-wrapper');
const cs = document.getElementById('cursor-star');

// 零延迟跟手：鼠标一动，光标立刻到达
document.addEventListener('mousemove', e => {
    cw.style.left = (e.clientX - 15) + 'px';
    cw.style.top  = (e.clientY - 15) + 'px';
});

// 按下时缩成小光点
document.addEventListener('mousedown', () => {
    cs.style.transform = 'scale(0.1)';
    cs.style.filter = 'drop-shadow(0 0 10px #00FFFF)';
});

// 松开时弹回来
document.addEventListener('mouseup', () => {
    cs.style.transform = 'scale(1)';
    cs.style.filter = 'drop-shadow(0 0 5px rgba(245,255,230,0.8))';
});

// 鼠标离开网页隐藏
document.addEventListener('mouseleave', () => {
    cw.style.opacity = '0';
});

// 鼠标进入网页显示
document.addEventListener('mouseenter', () => {
    cw.style.opacity = '1';
});

// 🌟 核心修复：进入 iframe（评论区）时隐藏光标，离开时恢复
function handleIframes() {
    const iframes = document.querySelectorAll('iframe');
    iframes.forEach(iframe => {
        if (iframe.dataset.cursorBound) return;
        iframe.dataset.cursorBound = 'true';
        iframe.addEventListener('mouseenter', () => { cw.style.opacity = '0'; });
        iframe.addEventListener('mouseleave', () => { cw.style.opacity = '1'; });
    });
}

handleIframes();
const observer = new MutationObserver(() => { handleIframes(); });
observer.observe(document.body, { childList: true, subtree: true });
</script>
